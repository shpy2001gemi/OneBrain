name: vNext foundation contract

on:
  pull_request:
    paths:
      - ".github/workflows/vnext-foundation.yml"
      - ".github/workflows/vnext-fuzz-nightly.yml"
      - ".github/workflows/vnext-soak.yml"
      - ".github/workflows/vnext-soak-macos-arm64.yml"
      - "docs/research/ONEBRAIN_FOUNDATION_IMPLEMENTATION_PLAN_V7_1.md"
      - "docs/research/WIP_DISTRIBUTED_RUNTIME_IMPLEMENTATION_PLAN_V2.md"
      - "docs/operations/**"
      - "docs/specs/vnext/**"
      - "formal/tla/**"
      - "scripts/ci/**"
      - "scripts/concept_registry/**"
      - "scripts/runner/**"
      - "src/**"
      - "src/ku-core/**"
      - "src/ku-ai/**"
      - "src/ku-encoder/**"
      - "src/ku-kql/**"
      - "src/ku-net/**"
      - "src/onebrain-node/**"
      - "src/onebrain-api/**"
      - "src/onebrain-cli/**"
      - "src/onebrain-desktop/**"
      - "src/onebrain-web/**"
      - "src/onebrain-protocol/**"
      - "src/test-vectors/vnext/**"
      - "src/Cargo.lock"
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/vnext-foundation.yml"
      - ".github/workflows/vnext-fuzz-nightly.yml"
      - ".github/workflows/vnext-soak.yml"
      - ".github/workflows/vnext-soak-macos-arm64.yml"
      - "docs/research/ONEBRAIN_FOUNDATION_IMPLEMENTATION_PLAN_V7_1.md"
      - "docs/research/WIP_DISTRIBUTED_RUNTIME_IMPLEMENTATION_PLAN_V2.md"
      - "docs/operations/**"
      - "docs/specs/vnext/**"
      - "formal/tla/**"
      - "scripts/ci/**"
      - "scripts/concept_registry/**"
      - "scripts/runner/**"
      - "src/**"
      - "src/ku-core/**"
      - "src/ku-ai/**"
      - "src/ku-encoder/**"
      - "src/ku-kql/**"
      - "src/ku-net/**"
      - "src/onebrain-node/**"
      - "src/onebrain-api/**"
      - "src/onebrain-cli/**"
      - "src/onebrain-desktop/**"
      - "src/onebrain-web/**"
      - "src/onebrain-protocol/**"
      - "src/test-vectors/vnext/**"
      - "src/Cargo.lock"

permissions:
  contents: read

jobs:
  macos-arm64-soak-smoke:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - name: Verify hosted Apple Silicon lane
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Verify native macOS resource collectors
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-soak-harness
          m5_07_macos_proc_metrics_are_available
          -- --nocapture
      - name: Run macOS ARM64 real-QUIC release smoke
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-soak-harness
          m5_07_release_smoke_uses_real_quic_fsync_and_all_fault_cycles
          -- --nocapture

  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/onebrain-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Validate task graph, traceability, vectors, and links
        working-directory: .
        run: |
          python scripts/ci/validate_vnext_contracts.py
          python -m unittest scripts.ci.test_validate_vnext_product_profile
          python -m unittest scripts.ci.test_validate_vnext_ws_profile
          python -m unittest scripts.ci.test_validate_vnext_cli_profile
          python -m unittest scripts.ci.test_validate_vnext_desktop_web_ux_profile
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_baseline
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_resource_admission
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_observability
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_crash_harness
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_chaos_fuzz
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_operational_compaction
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_mixed_rollback
          python -m unittest scripts.ci.test_validate_vnext_dr_m5_soak_release
          python -m unittest scripts.ci.test_validate_vnext_soak_runner_kit
          python -m unittest scripts.ci.test_validate_vnext_macos_soak_runner_kit
          bash -n scripts/runner/onebrain-soak-runner.sh
          bash scripts/ci/test_onebrain_soak_runner_macos.sh

      - name: P3.4 Web UX build, lint, and receipt contract
        working-directory: src/onebrain-web
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:vnext

      - name: Build and verify a small Concept Registry fixture
        working-directory: .
        run: |
          python -m pip install --requirement scripts/concept_registry/requirements.txt
          python -m unittest scripts/concept_registry/test_build_obr.py

      - name: Check formatting of vNext-owned Rust files
        run: >-
          rustfmt --edition 2021 --check
          ku-core/src/foundation/affordance.rs
          ku-core/src/foundation/assembly.rs
          ku-core/src/foundation/authority.rs
          ku-core/src/foundation/mod.rs
          ku-core/src/foundation/canonical.rs
          ku-core/src/foundation/capability.rs
          ku-core/src/foundation/capability_offer.rs
          ku-core/src/foundation/capability_permit.rs
          ku-core/src/foundation/checkpoint.rs
          ku-core/src/foundation/checkpoint_compaction.rs
          ku-core/src/foundation/content_id.rs
          ku-core/src/foundation/dr_m5_failpoint.rs
          ku-core/src/foundation/envelope.rs
          ku-core/src/foundation/conformance.rs
          ku-core/src/foundation/event.rs
          ku-core/src/foundation/feed.rs
          ku-core/src/foundation/feed_signer.rs
          ku-core/src/foundation/feed_store.rs
          ku-core/src/foundation/fidelity.rs
          ku-core/src/foundation/fidelity_assessment.rs
          ku-core/src/foundation/identity.rs
          ku-core/src/foundation/inventory.rs
          ku-core/src/foundation/key_state.rs
          ku-core/src/foundation/mapping.rs
          ku-core/src/foundation/materialization.rs
          ku-core/src/foundation/metabolic_view.rs
          ku-core/src/foundation/object.rs
          ku-core/src/foundation/observation.rs
          ku-core/src/foundation/operational_compaction.rs
          ku-core/src/foundation/outcome_evidence.rs
          ku-core/src/foundation/provider.rs
          ku-core/src/foundation/receptor.rs
          ku-core/src/foundation/resolution.rs
          ku-core/src/foundation/revocation.rs
          ku-core/src/foundation/schema_registry.rs
          ku-core/src/foundation/semantic.rs
          ku-core/src/foundation/storage.rs
          ku-core/src/foundation/use_evidence.rs
          ku-core/src/foundation/vault.rs
          ku-core/examples/foundation_vector_digests.rs
          ku-ai/src/vnext_manifest.rs
          ku-ai/src/vnext_executor.rs
          ku-ai/src/vnext_fidelity.rs
          ku-ai/src/vnext_model_recall.rs
          ku-encoder/src/vnext_affordance_extractor.rs
          ku-encoder/src/vnext_observation_intake.rs
          ku-encoder/src/vnext_receptor_encoder.rs
          ku-net/tests/foundation_conformance.rs
          ku-net/src/lib.rs
          ku-net/src/transport.rs
          ku-net/src/vnext_inventory_forest.rs
          ku-net/src/vnext_bridge_merge.rs
          ku-net/src/vnext_carrier.rs
          ku-net/src/vnext_carrier_adapter.rs
          ku-net/src/vnext_chaos.rs
          ku-net/src/vnext_reachability.rs
          ku-net/src/vnext_reconciliation.rs
          ku-net/src/vnext_reconciliation_journal.rs
          ku-net/src/vnext_resource_gate.rs
          ku-net/src/vnext_quic_session.rs
          ku-net/src/vnext_provider_view.rs
          ku-net/src/vnext_session.rs
          ku-kql/src/vnext_proposal.rs
          ku-kql/src/vnext_planner.rs
          ku-kql/src/vnext_matcher.rs
          ku-kql/src/vnext_query.rs
          ku-kql/src/vnext_query_view.rs
          ku-kql/src/vnext_multipath.rs
          ku-kql/src/vnext_obkg_projection.rs
          ku-kql/src/vnext_assembly_search.rs
          ku-kql/src/vnext_relational_alignment.rs
          ku-kql/src/vnext_reunion.rs
          ku-kql/src/vnext_disclosure.rs
          ku-kql/src/vnext_disclosure_capsule.rs
          ku-kql/src/vnext_exploration.rs
          ku-kql/src/vnext_route_packet.rs
          ku-kql/src/vnext_semantic_index.rs
          ku-kql/src/vnext_standing_need.rs
          ku-kql/src/vnext_structural_signature.rs
          onebrain-node/src/vnext_config.rs
          onebrain-node/src/vnext_crash_harness.rs
          onebrain-node/src/vnext_distributed_kql.rs
          onebrain-node/src/vnext_distributed_pomv.rs
          onebrain-node/src/vnext_fuzz_targets.rs
          onebrain-node/src/vnext_network_runtime.rs
          onebrain-node/src/vnext_observability.rs
          onebrain-node/src/vnext_operational_compaction.rs
          onebrain-node/src/vnext_outbox.rs
          onebrain-node/src/vnext_record_provenance.rs
          onebrain-node/src/lib.rs
          onebrain-node/src/vnext_companion.rs
          onebrain-node/src/vnext_local_runtime.rs
          onebrain-node/src/vnext_legacy_migration.rs
          onebrain-node/src/vnext_m5_benchmark.rs
          onebrain-node/src/vnext_m6_model.rs
          onebrain-node/src/vnext_mixed_conformance.rs
          onebrain-node/src/vnext_performance_budgets.rs
          onebrain-node/src/vnext_product_runtime.rs
          onebrain-node/src/vnext_runtime_rollout.rs
          onebrain-node/src/vnext_reunion_canary.rs
          onebrain-node/src/vnext_soak_release.rs
          onebrain-node/src/vnext_reward_firewall.rs
          onebrain-node/src/vnext_route_authority.rs
          onebrain-node/src/vnext_scale_simulation.rs
          onebrain-node/src/vnext_security_suite.rs
          onebrain-node/src/vnext_status.rs
          onebrain-node/src/vnext_workflow_surface.rs
          onebrain-node/examples/qa007_scale_report.rs
          onebrain-node/examples/qa008_performance_report.rs
          onebrain-node/examples/dr_m5_fuzz_corpus_smoke.rs
          onebrain-node/examples/dr_m5_soak_release.rs
          onebrain-node/tests/anti_gravity_reunion.rs
          onebrain-api/src/handlers.rs
          onebrain-api/src/server.rs
          onebrain-api/src/vnext_api.rs
          onebrain-api/src/vnext_ws.rs
          onebrain-cli/src/main.rs
          onebrain-cli/src/cli/help.rs
          onebrain-cli/src/cli/mod.rs
          onebrain-cli/src/cli/vnext.rs
          onebrain-cli/src/cli/workflow.rs
          onebrain-desktop/src/commands.rs
          onebrain-desktop/src/tray.rs
          onebrain-protocol/src/codec.rs
          onebrain-protocol/src/legacy.rs
          onebrain-protocol/src/legacy_adapter.rs
          onebrain-protocol/src/lib.rs
          onebrain-protocol/src/reconciliation_codec.rs
          onebrain-protocol/src/session_codec.rs
          onebrain-protocol/src/types.rs
          onebrain-protocol/tests/foundation_conformance.rs

      - name: Check formatting of every live workspace Rust target
        run: cargo fmt --all -- --check

      - name: Check foundation crates
        run: >-
          cargo check --locked
          -p ku-core -p ku-ai -p ku-encoder -p ku-kql -p onebrain-protocol -p ku-net -p onebrain-node
          -p onebrain-api -p onebrain-cli

      - name: Lint foundation crates
        run: >-
          cargo clippy --locked
          -p ku-core -p ku-ai -p ku-encoder -p ku-kql -p onebrain-protocol -p onebrain-node
          --lib --tests --examples
          -- --cap-lints warn

      - name: Lint vNext network library
        run: cargo clippy --locked -p ku-net --lib -- --cap-lints warn

      - name: Test canonical foundation
        run: cargo test --locked -p ku-core foundation

      - name: Test feed signer custody and pre-side-effect failures
        run: >-
          cargo test --locked -p ku-core foundation::feed_signer
          && cargo test --locked -p ku-core foundation::event
          && cargo test --locked -p ku-encoder vnext_observation_intake

      - name: Test canonical capability layer boundaries
        run: cargo test --locked -p ku-core foundation::capability

      - name: Test signed capability offer reducer
        run: cargo test --locked -p ku-core foundation::capability_offer

      - name: Test attenuated capability permit validator
        run: cargo test --locked -p ku-core foundation::capability_permit

      - name: Test action-scoped revocation freshness policy
        run: cargo test --locked -p ku-core foundation::revocation

      - name: Test signed multi-provider lease and retirement reducer
        run: cargo test --locked -p ku-core foundation::provider

      - name: Test proof-gated per-feed checkpoints
        run: cargo test --locked -p ku-core foundation::checkpoint

      - name: Test shadow compaction restore and local GC gates
        run: cargo test --locked -p ku-core foundation::checkpoint_compaction

      - name: Test bounded sampled provider discovery view
        run: cargo test --locked -p ku-net --lib vnext_provider_view

      - name: Test encoding fidelity evidence boundaries
        run: cargo test --locked -p ku-core foundation::fidelity

      - name: Test frontier-relative fidelity assessment reducer
        run: cargo test --locked -p ku-core foundation::fidelity_assessment

      - name: Test local manifest builder and conformance runner
        run: cargo test --locked -p ku-ai vnext_manifest

      - name: Test typed permit-gated cognitive executor
        run: cargo test --locked -p ku-ai vnext_executor

      - name: Test model recall symbolic validity firewall
        run: cargo test --locked -p ku-ai vnext_model_recall

      - name: Test blind encoding fidelity workflow
        run: cargo test --locked -p ku-ai vnext_fidelity

      - name: Test private-default disclosure sanitizer
        run: cargo test --locked -p ku-kql vnext_disclosure

      - name: Test padded replay-protected route packets
        run: cargo test --locked -p ku-kql vnext_route_packet

      - name: Test permit-bound progressive disclosure capsules
        run: cargo test --locked -p ku-kql vnext_disclosure_capsule

      - name: Test crash-safe validated persistence
        run: cargo test --locked -p ku-core --features persist foundation::storage

      - name: Test encrypted private vault
        run: cargo test --locked -p ku-core foundation::vault

      - name: Test signed Use and Derivation evidence path
        run: cargo test --locked -p ku-core foundation::use_evidence

      - name: Test revisioned metabolic evidence view and exposure firewall
        run: cargo test --locked -p ku-core foundation::metabolic_view

      - name: Test signed outcome and benefit evidence branches
        run: cargo test --locked -p ku-core foundation::outcome_evidence

      - name: Test non-authoritative KQL binding proposals
        run: cargo test --locked -p ku-kql vnext_proposal

      - name: Test local provenance-preserving Receptor encoder
        run: cargo test --locked -p ku-encoder vnext_receptor_encoder

      - name: Test consent-gated private local observation intake
        run: cargo test --locked -p ku-encoder vnext_observation_intake

      - name: Test offline evidence-bounded Affordance extractor
        run: cargo test --locked -p ku-encoder vnext_affordance_extractor

      - name: Test persistent local StandingNeeds
        run: cargo test --locked -p ku-kql --features storage vnext_standing_need

      - name: Test encrypted private KQL persistence and lifecycle
        run: cargo test --locked -p ku-kql --features storage vnext_private_need

      - name: Test deterministic vocabulary-neutral structural signatures
        run: cargo test --locked -p ku-kql vnext_structural_signature

      - name: Test bounded explainable typed relational alignment
        run: cargo test --locked -p ku-kql vnext_relational_alignment

      - name: Test bounded Pareto Assembly search
        run: cargo test --locked -p ku-kql vnext_assembly_search

      - name: Test private debt-backed exploration scheduler
        run: cargo test --locked -p ku-kql vnext_exploration

      - name: Test late-safe QueryView and propensity-aware learning
        run: cargo test --locked -p ku-kql vnext_query_view

      - name: Test private multipath union and encrypted StandingNeed mailbox
        run: cargo test --locked -p ku-kql vnext_multipath

      - name: Test disposable version-bound OBKG projections
        run: cargo test --locked -p ku-kql vnext_obkg_projection

      - name: Test frontier-delta reunion joins
        run: cargo test --locked -p ku-kql vnext_reunion

      - name: Test protocol conformance runner
        run: cargo test --locked -p onebrain-protocol --test foundation_conformance

      - name: Test canonical protocol codec and legacy isolation
        run: cargo test --locked -p onebrain-protocol --lib

      - name: Test negotiated legacy alias downgrade firewall
        run: cargo test --locked -p onebrain-protocol legacy_adapter

      - name: Test bound OBP reconciliation schema
        run: cargo test --locked -p onebrain-protocol --lib reconciliation_codec

      - name: Test network conformance runner
        run: cargo test --locked -p ku-net --test foundation_conformance

      - name: Test selector-scoped Hybrid Inventory Forest
        run: cargo test --locked -p ku-net --lib vnext_inventory_forest

      - name: Test authenticated transcript-bound sessions
        run: cargo test --locked -p ku-net --lib vnext_session

      - name: Test local derived ReachabilityView
        run: cargo test --locked -p ku-net --lib vnext_reachability

      - name: Test deterministic reconciliation state machine
        run: cargo test --locked -p ku-net --lib vnext_reconciliation

      - name: Test crash-resumable reconciliation journal
        run: cargo test --locked -p ku-net --features persist --lib vnext_reconciliation_journal

      - name: Test multi-bridge deterministic dedup
        run: cargo test --locked -p ku-net --lib vnext_bridge_merge

      - name: Test memory and file-bundle carriers
        run: cargo test --locked -p ku-net --lib vnext_carrier

      - name: Test cross-carrier reconciliation outcome
        run: cargo test --locked -p ku-net --lib vnext_carrier_adapter

      - name: Test safe feature and kill-switch configuration
        run: cargo test --locked -p onebrain-node vnext_config

      - name: Test one-way knowledge-plane reward firewall
        run: cargo test --locked -p onebrain-node vnext_reward_firewall

      - name: Test offline local vertical slice across restart
        run: cargo test --locked -p onebrain-node vnext_local_runtime

      - name: Test offline policy-gated Local Knowledge Companion
        run: cargo test --locked -p onebrain-node vnext_companion

      - name: Test reproducible M5 multi-objective benchmark and ablation
        run: cargo test --locked -p onebrain-node vnext_m5_benchmark

      - name: Test five executable M6 bounded-state models
        run: cargo test --locked -p onebrain-node vnext_m6_model

      - name: Test Anti-Gravity partition and reunion canary
        run: cargo test --locked -p onebrain-node --test anti_gravity_reunion

      - name: Test additive legacy migration and backfill
        run: cargo test --locked -p onebrain-node vnext_legacy_migration

      - name: Test honest scoped runtime status
        run: cargo test --locked -p onebrain-node vnext_status

      - name: Test additive KU workflow API and CLI contract
        run: >-
          cargo test --locked -p onebrain-node run002_ --lib
          && cargo test --locked -p onebrain-cli run002_

      - name: Test mixed-version and cross-carrier matrix
        run: cargo test --locked -p onebrain-node vnext_mixed_conformance

      - name: Test adversarial security suite and runtime allocation guard
        run: >-
          cargo test --locked -p onebrain-node vnext_security_suite --lib
          && cargo test --locked -p ku-net vnext_resource_gate --lib

      - name: Test algebraic and trace properties
        run: >-
          cargo test --locked -p ku-core qa006_ --lib
          && cargo test --locked -p ku-net qa006_ --lib

      - name: Test logical-node scale and analytical bounds
        run: cargo test --locked -p onebrain-node qa007_ --lib

      - name: Test correctness-coupled performance budgets
        run: cargo test --locked -p onebrain-node qa008_ --lib

  workspace-default:
    name: Default-feature workspace baseline (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Test the full workspace with default features
        run: cargo test --workspace --locked -- --test-threads=2

      - name: Enforce capability truth for legacy wallet surfaces
        run: cargo test --locked -p onebrain-node --test p0_capability_truth

  vnext-network-runtime:
    name: Feature-enabled real-QUIC acceptance (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Compile product entrypoints with the runtime feature
        run: >-
          cargo check --locked
          -p onebrain-node -p onebrain-api -p onebrain-cli
          --features onebrain-node/vnext-network-runtime
      - name: Lint every feature-enabled node target
        run: >-
          cargo clippy --locked -p onebrain-node
          --features vnext-network-runtime --all-targets
          -- --cap-lints warn
      - name: M2 authenticated OBP-RP over real QUIC
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_network_runtime
      - name: M3 private-vault-rehydrated distributed KQL over real peers
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_distributed_kql
      - name: M4 strong Public Use consent and metabolic view over real peers
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_distributed_pomv
      - name: P1.5 authenticated route and local authority boundary
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_route_authority
      - name: P2.1 node-owned product runtime aggregate
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_product_runtime
      - name: P2.2 independent product lanes and hard budgets
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_config
      - name: P2.3 ordered lifecycle and partial-start rollback
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_product_runtime
      - name: P2.4 durable selector/type incremental processing
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_record_provenance
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_distributed_kql
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_distributed_pomv
      - name: P2.5 cloneable service handles and concurrency fence
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_product_runtime
      - name: M5.1 unified resource admission and fair outbox
        run: >-
          cargo test --locked -p ku-net
          vnext_resource_gate --lib
          && cargo test --locked -p ku-net
          --features quic vnext_quic_session --lib
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime --lib vnext_outbox
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime --lib vnext_record_provenance
      - name: M5.2 typed observability and operator snapshot
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime --lib vnext_observability
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime --lib
          vnext_network_runtime::tests::admission_and_payload_failures_map_to_stable_low_cardinality_reasons
          && cargo test --locked -p onebrain-api
          --features vnext-network-runtime --lib
          vnext_api::tests::runtime_status_and_disabled_lane_keep_the_vnext_envelope
      - name: M5.3 real Redb process-kill crash matrix
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-crash-harness
          --lib vnext_crash_harness::tests
          -- --test-threads=1
      - name: M5.4 real-QUIC chaos and adversarial flood
        run: >-
          cargo test --locked -p ku-net
          --features dr-m5-chaos-harness
          --lib vnext_chaos
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-chaos-harness
          --lib vnext_fuzz_targets
          -- --test-threads=1
      - name: M5.4 deterministic parser corpus smoke
        run: >-
          cargo run --locked -p onebrain-node
          --features vnext-chaos-harness
          --example dr_m5_fuzz_corpus_smoke
      - name: M5.5 operational compaction and process-kill recovery
        run: >-
          cargo test --locked -p ku-net
          --features persist,dr-m5-crash-harness
          --lib vnext_reconciliation_journal
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-compaction-harness
          --lib vnext_outbox
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-compaction-harness
          --lib vnext_operational_compaction
          -- --test-threads=1
      - name: M5.6 mixed-version runtime rollback and process-kill recovery
        run: >-
          cargo test --locked -p onebrain-node
          --lib vnext_mixed_conformance
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-crash-harness
          --lib vnext_runtime_rollout
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --lib vnext_product_runtime
          -- --test-threads=1
          && cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --test vnext_node_runtime
          -- --test-threads=1
      - name: M5.7 optimized real-QUIC soak and performance release smoke
        run: >-
          cargo test --locked --release -p onebrain-node
          --features vnext-soak-harness
          --lib vnext_soak_release
          -- --test-threads=1
          && cargo run --locked --release -p onebrain-node
          --features vnext-soak-harness
          --example dr_m5_soak_release --
          --profile smoke
          --data-dir "${RUNNER_TEMP}/onebrain-m5-07-ci"
          --output "${RUNNER_TEMP}/onebrain-m5-07-ci-report.json"
      - name: P3.1 authenticated REST API contract and real-runtime flow
        run: >-
          cargo test --locked -p onebrain-api
          --features vnext-network-runtime
          --lib vnext_api::tests
          -- --test-threads=1
      - name: P3.2 private WebSocket isolation and backpressure
        run: >-
          cargo test --locked -p onebrain-api
          --features vnext-network-runtime
          --lib vnext_ws::tests
          -- --test-threads=1
      - name: P3.3 authenticated CLI contract and real-runtime replay
        run: >-
          cargo test --locked -p onebrain-cli
          --features vnext-network-runtime
          vnext
          -- --test-threads=1
      - name: Node-owned real QUIC lifecycle
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --test vnext_node_runtime

  windows-smoke:
    name: Default and vNext smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Compile default product entrypoints
        run: cargo check --locked -p onebrain-node -p onebrain-api -p onebrain-cli
      - name: Compile the native desktop entrypoint
        run: cargo check --locked -p onebrain-desktop
      - name: Compile feature-enabled product entrypoints
        run: >-
          cargo check --locked
          -p onebrain-node -p onebrain-api -p onebrain-cli
          --features onebrain-node/vnext-network-runtime
      - name: Compile the native desktop entrypoint with the runtime feature
        run: >-
          cargo check --locked -p onebrain-desktop
          --features vnext-network-runtime
      - name: Smoke UTF-8 and production anti-gaming contracts
        run: |
          cargo test --locked -p ku-core ku_system_prompt
          cargo test --locked -p ku-core obt_anti_gaming
      - name: Smoke node-owned feature lifecycle
        run: >-
          cargo test --locked -p onebrain-node
          --features vnext-network-runtime
          --test vnext_node_runtime
