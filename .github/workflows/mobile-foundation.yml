name: Mobile foundation

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-foundation.yml"
      - "docs/design/mobile/**"
      - "docs/features/mobile/**"
      - "docs/research/WIP_MOBILE_APP_*.md"
      - "scripts/ci/validate_mobile_build_contracts.py"
      - "src/onebrain-mobile/**"
  push:
    branches:
      - "codex/mobile-*"
    paths:
      - ".github/workflows/mobile-foundation.yml"
      - "src/onebrain-mobile/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter tests, native bridge and Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: src/onebrain-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,x86_64-linux-android
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Verify pinned font and rounded-icon assets
        run: python tool/verify_font_assets.py
      - name: Verify BootstrapOnly source isolation
        run: python tool/verify_bootstrap_source_isolation.py
      - name: Install pinned Rust mobile build tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install cbindgen --version 0.29.4 --locked
      - name: Test and cross-compile Rust bridge
        run: |
          cargo test --manifest-path ../Cargo.toml -p onebrain-mobile-bridge
          python tool/build_rust_android.py
      - name: Verify generated Rust C header
        run: |
          python tool/generate_rust_bridge_header.py
          git diff --exit-code -- ../onebrain-mobile-bridge/include/onebrain_mobile_bridge.h
      - name: Verify generated design tokens
        run: |
          dart run tool/generate_design_tokens.dart
          python tool/normalize_generated_sources.py
          git diff --exit-code -- lib/design/generated/mobile_design_tokens.g.dart
      - name: Verify generated typed host APIs
        run: |
          dart run pigeon --input pigeons/mobile_host_api.dart
          python tool/normalize_generated_sources.py
          git diff --exit-code -- \
            lib/platform/generated/mobile_host_api.g.dart \
            android/app/src/main/kotlin/org/onebrain/onebrain_mobile/generated/MobileHostApi.g.kt \
            ios/Runner/Generated/MobileHostApi.g.swift
      - name: Generate localization
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/app_localizations*.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --exclude-tags golden
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Reject bundled Registry and model payloads
        run: >-
          python tool/scan_mobile_package.py
          build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable KVM for Android integration tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise typed host bridge on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: src/onebrain-mobile
          script: flutter test integration_test/native_host_bridge_test.dart -d emulator-5554
      - name: Build BootstrapOnly Android release APK
        run: |
          python tool/build_rust_android.py --release
          flutter build apk --release --target-platform android-arm64,android-x64
      - name: Prove release has no Registry payload or network capability
        run: |
          python tool/scan_mobile_package.py \
            build/app/outputs/flutter-apk/app-release.apk
          python tool/inspect_android_permissions.py \
            build/app/outputs/flutter-apk/app-release.apk
      - name: Validate owner-approved mobile contracts
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/validate_mobile_build_contracts.py
          python -m unittest scripts.ci.test_validate_mobile_build_contracts

  goldens:
    name: Windows design-system goldens
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/onebrain-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Verify pinned assets
        run: python tool/verify_font_assets.py
      - name: Compare design-system golden matrix
        run: flutter test test/golden_test.dart

  ios:
    name: iOS simulator compile
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/onebrain-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build Rust bridge for iOS device and simulator
        run: bash tool/build_rust_ios.sh
      - name: Generate localization and typed host APIs
        run: |
          flutter gen-l10n
          dart run pigeon --input pigeons/mobile_host_api.dart
          python tool/normalize_generated_sources.py
      - name: Compile iOS simulator app
        run: flutter build ios --simulator --debug
