name: Base v1 Task 28 prebuilt Registry, P5, and 72-hour soak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-v1-task28-${{ github.run_id }}
  cancel-in-progress: false

env:
  REQUEST_FILE: ${{ secrets.ONEBRAIN_BASE_RELEASE_REQUEST }}
  REQUEST_SIGNATURE: ${{ secrets.ONEBRAIN_BASE_RELEASE_REQUEST_SIGNATURE }}
  APPROVER_POLICY: ${{ secrets.ONEBRAIN_QUALIFICATION_APPROVER_POLICY }}
  QUALIFICATION_GPG_HOME: ${{ secrets.ONEBRAIN_QUALIFICATION_GPG_HOME }}
  REGISTRY_PREBUILT_ROOT: ${{ secrets.ONEBRAIN_TASK28_REGISTRY_PREBUILT_ROOT }}
  REGISTRY_PREBUILT_BINDING: ${{ secrets.ONEBRAIN_TASK28_REGISTRY_PREBUILT_BINDING }}
  CANDIDATE_SEMANTIC_EVIDENCE: ${{ secrets.ONEBRAIN_CANDIDATE_SEMANTIC_EVIDENCE }}
  BASE_SBOM_FILE: ${{ secrets.ONEBRAIN_BASE_SBOM_FILE }}
  BASE_PROVENANCE_FILE: ${{ secrets.ONEBRAIN_BASE_PROVENANCE_FILE }}
  RUNNER_IMAGE_EVIDENCE_FILE: ${{ secrets.ONEBRAIN_RUNNER_IMAGE_EVIDENCE_FILE }}

jobs:
  verify-exact-release-request:
    name: Verify immutable Task 28 request v2
    if: github.ref == 'refs/heads/main'
    environment: base-v1-production-qualification
    runs-on: [self-hosted, linux, x64, onebrain-base-v1-controller]
    outputs:
      release_request_digest: ${{ steps.identity.outputs.release_request_digest }}
      qualification_session_id: ${{ steps.identity.outputs.qualification_session_id }}
      candidate_commit: ${{ steps.identity.outputs.candidate_commit }}
      candidate_tree: ${{ steps.identity.outputs.candidate_tree }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
          clean: true
      - name: Verify candidate-owned request bytes and signature
        run: >-
          python scripts/release/verify_base_release_request.py
          --request "$REQUEST_FILE"
          --signature "$REQUEST_SIGNATURE"
          --policy "$APPROVER_POLICY"
          --gpg-home "$QUALIFICATION_GPG_HOME"
          > "$RUNNER_TEMP/verified-release-request.json"
      - name: Derive only authenticated pre-measurement identity
        id: identity
        shell: bash
        run: |
          python - "$RUNNER_TEMP/verified-release-request.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          verified = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if verified.get("format") != "onebrain/verified-qualification-context/2":
              raise SystemExit("Task 28 verified context v2 is required")
          run = verified["run_context"]
          with Path(sys.argv[2]).open("a", encoding="utf-8") as stream:
              for key in ("release_request_digest", "qualification_session_id", "candidate_commit", "candidate_tree"):
                  stream.write(f"{key}={run[key]}\n")
          PY
      - name: Reconfirm exact checked-out candidate identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.candidate_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.identity.outputs.candidate_tree }}"
      - name: Preserve verified request context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-base-release-request-${{ steps.identity.outputs.release_request_digest }}
          path: ${{ runner.temp }}/verified-release-request.json
          if-no-files-found: error
          retention-days: 90

  verify-prebuilt-registry:
    name: Verify signed owner-local prebuilt Registry bytes
    needs: verify-exact-release-request
    environment: base-v1-production-qualification
    runs-on: [self-hosted, linux, x64, onebrain-base-v1-controller]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify-exact-release-request.outputs.candidate_commit }}
          persist-credentials: false
          clean: true
      - name: Rehash and verify final Registry output without rebuilding sources
        run: >-
          python scripts/release/task28_prebuilt_registry.py verify
          --release-request "$REQUEST_FILE" --release-signature "$REQUEST_SIGNATURE"
          --base-policy "$APPROVER_POLICY" --base-gpg-home "$QUALIFICATION_GPG_HOME"
          --registry-root "$REGISTRY_PREBUILT_ROOT" --binding "$REGISTRY_PREBUILT_BINDING"
          --candidate-semantic-evidence "$CANDIDATE_SEMANTIC_EVIDENCE"
          --candidate-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/registry/prebuilt-registry-verified.json"
      - name: Preserve signed binding without private material
        shell: bash
        run: |
          install -m 0444 "$REGISTRY_PREBUILT_BINDING" "$RUNNER_TEMP/registry/prebuilt-registry-binding.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-prebuilt-${{ needs.verify-exact-release-request.outputs.release_request_digest }}
          path: ${{ runner.temp }}/registry
          if-no-files-found: error
          retention-days: 90

  p5-v2:
    name: Verify fresh exact-candidate P5 V2 production evidence
    needs: [verify-exact-release-request, verify-prebuilt-registry]
    environment: base-v1-production-qualification
    runs-on: [self-hosted, linux, x64, onebrain-p5-controller]
    outputs:
      p5_aggregate_root: ${{ steps.p5.outputs.p5_aggregate_root }}
    env:
      P5_REQUEST_FILE: ${{ secrets.ONEBRAIN_P5_V2_REQUEST_FILE }}
      P5_SIGNATURE_FILE: ${{ secrets.ONEBRAIN_P5_V2_SIGNATURE_FILE }}
      P5_APPROVAL_POLICY: ${{ secrets.ONEBRAIN_P5_V2_APPROVAL_POLICY }}
      P5_INVENTORY_FILE: ${{ secrets.ONEBRAIN_P5_V2_INVENTORY_FILE }}
      P5_RAW_EVIDENCE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_RAW_EVIDENCE_ROOT }}
      P5_AGGREGATE_FILE: ${{ secrets.ONEBRAIN_P5_V2_AGGREGATE_FILE }}
      P5_BUNDLE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_BUNDLE_ROOT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify-exact-release-request.outputs.candidate_commit }}
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: registry-prebuilt-${{ needs.verify-exact-release-request.outputs.release_request_digest }}
          path: ${{ runner.temp }}/registry
      - name: Independently verify P5 V2 request, raw receipts, and aggregate
        run: >-
          python scripts/release/validate_evidence_carry_forward.py verify-p5
          --release-request "$REQUEST_FILE" --release-signature "$REQUEST_SIGNATURE"
          --base-policy "$APPROVER_POLICY" --base-gpg-home "$QUALIFICATION_GPG_HOME"
          --p5-request "$P5_REQUEST_FILE" --p5-signature "$P5_SIGNATURE_FILE"
          --p5-approval-policy "$P5_APPROVAL_POLICY" --inventory "$P5_INVENTORY_FILE"
          --raw-evidence-root "$P5_RAW_EVIDENCE_ROOT" --p5-aggregate "$P5_AGGREGATE_FILE"
          --executable "$P5_BUNDLE_ROOT/bin/p5_multi_host_agent_v2"
          --bundle-root "$P5_BUNDLE_ROOT" --registry-candidate-root "$REGISTRY_PREBUILT_ROOT"
          --output "$RUNNER_TEMP/p5-v2-verified.json"
      - name: compare-release-executable-hashes
        id: p5
        shell: bash
        run: |
          python - "$RUNNER_TEMP/p5-v2-verified.json" "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys, time
          from datetime import datetime
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not report["multi_host_qualified"]:
              raise SystemExit("P5 V2 multi-host qualification failed")
          p5_request = json.loads(Path(os.environ["P5_REQUEST_FILE"]).read_text(encoding="utf-8"))
          base_request = json.loads(Path(os.environ["REQUEST_FILE"]).read_text(encoding="utf-8"))
          base_expires = int(datetime.fromisoformat(base_request["expires_utc"].replace("Z", "+00:00")).timestamp())
          minimum_remaining_seconds = 280800  # 72 hours plus six hours of fail-closed margin.
          now = int(time.time())
          if min(int(p5_request["expires_at"]), base_expires) - now < minimum_remaining_seconds:
              raise SystemExit("signed request validity cannot cover a fresh 72-hour soak plus margin")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as stream:
              stream.write(f"p5_aggregate_root={report['aggregate_blake3']}\n")
          PY
          test -x "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release"
          b3sum "$P5_BUNDLE_ROOT/bin/p5_multi_host_agent_v2" "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release"
      - name: Stage public P5 authority and aggregate bytes
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/p5-public"
          install -m 0444 "$P5_REQUEST_FILE" "$RUNNER_TEMP/p5-public/p5-request.json"
          install -m 0444 "$P5_SIGNATURE_FILE" "$RUNNER_TEMP/p5-public/p5-request.sig"
          install -m 0444 "$P5_APPROVAL_POLICY" "$RUNNER_TEMP/p5-public/p5-approval-policy.json"
          install -m 0444 "$P5_INVENTORY_FILE" "$RUNNER_TEMP/p5-public/p5-inventory.json"
          install -m 0444 "$P5_AGGREGATE_FILE" "$RUNNER_TEMP/p5-public/p5-multi-host-aggregate.json"
          install -m 0444 "$RUNNER_TEMP/p5-v2-verified.json" "$RUNNER_TEMP/p5-public/p5-v2-verified.json"
      - name: Retain verified public P5 aggregate references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-v2-verified-${{ needs.verify-exact-release-request.outputs.release_request_digest }}
          path: ${{ runner.temp }}/p5-public
          if-no-files-found: error
          retention-days: 90

  soak-runners:
    name: Fresh 72-hour soak ${{ matrix.runner_id }}
    needs: [verify-exact-release-request, verify-prebuilt-registry, p5-v2]
    environment: base-v1-production-qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner_id: runner-a, runner_label: onebrain-soak-a, signing_key_secret: ONEBRAIN_SOAK_RUNNER_A_PRIVATE_KEY}
          - {runner_id: runner-b, runner_label: onebrain-soak-b, signing_key_secret: ONEBRAIN_SOAK_RUNNER_B_PRIVATE_KEY}
          - {runner_id: runner-c, runner_label: onebrain-soak-c, signing_key_secret: ONEBRAIN_SOAK_RUNNER_C_PRIVATE_KEY}
    runs-on: [self-hosted, linux, x64, onebrain-soak, "${{ matrix.runner_label }}"]
    timeout-minutes: 4440
    env:
      SOAK_RUNNER_PRIVATE_KEY: ${{ secrets[matrix.signing_key_secret] }}
      P5_RAW_EVIDENCE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_RAW_EVIDENCE_ROOT }}
      P5_BUNDLE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_BUNDLE_ROOT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify-exact-release-request.outputs.candidate_commit }}
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: "registry-prebuilt-${{ needs.verify-exact-release-request.outputs.release_request_digest }}", path: "${{ runner.temp }}/registry"}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: "p5-v2-verified-${{ needs.verify-exact-release-request.outputs.release_request_digest }}", path: "${{ runner.temp }}/p5"}
      - name: Run fresh uninterrupted exact-candidate 72-hour soak
        shell: bash
        run: |
          test -x "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release"
          python -c 'import time; print(time.monotonic_ns())' > "$RUNNER_TEMP/monotonic-start-ns"
          "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release" --profile pre-release-72h --data-dir "$RUNNER_TEMP/base-v1-soak" --output "$RUNNER_TEMP/base-v1-soak-report.json"
          python -c 'import time; print(time.monotonic_ns())' > "$RUNNER_TEMP/monotonic-end-ns"
      - name: Create candidate binding and signed runner receipt
        run: >-
          python scripts/release/validate_evidence_carry_forward.py sign-child
          --request "$REQUEST_FILE" --signature "$REQUEST_SIGNATURE"
          --policy "$APPROVER_POLICY" --gpg-home "$QUALIFICATION_GPG_HOME"
          --registry-binding "$RUNNER_TEMP/registry/prebuilt-registry-binding.json"
          --registry-prebuilt-root "$REGISTRY_PREBUILT_ROOT"
          --candidate-semantic-evidence "$CANDIDATE_SEMANTIC_EVIDENCE"
          --p5-request "$RUNNER_TEMP/p5/p5-request.json"
          --p5-signature "$RUNNER_TEMP/p5/p5-request.sig"
          --p5-approval-policy "$RUNNER_TEMP/p5/p5-approval-policy.json"
          --p5-inventory "$RUNNER_TEMP/p5/p5-inventory.json"
          --p5-raw-evidence-root "$P5_RAW_EVIDENCE_ROOT"
          --p5-aggregate "$RUNNER_TEMP/p5/p5-multi-host-aggregate.json"
          --p5-executable "$P5_BUNDLE_ROOT/bin/p5_multi_host_agent_v2"
          --p5-bundle-root "$P5_BUNDLE_ROOT"
          --p5-registry-candidate-root "$REGISTRY_PREBUILT_ROOT"
          --executable "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release"
          --sbom "$BASE_SBOM_FILE" --provenance "$BASE_PROVENANCE_FILE"
          --runner-image-evidence "$RUNNER_IMAGE_EVIDENCE_FILE"
          --runner-id "${{ matrix.runner_id }}" --runner-identity "$RUNNER_NAME"
          --monotonic-start-file "$RUNNER_TEMP/monotonic-start-ns" --monotonic-end-file "$RUNNER_TEMP/monotonic-end-ns"
          --raw-report "$RUNNER_TEMP/base-v1-soak-report.json" --signing-key "$SOAK_RUNNER_PRIVATE_KEY"
          --output "$RUNNER_TEMP/base-v1-soak-child-receipt.json"
      - name: retain-signed-raw-receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-v1-soak-raw-${{ matrix.runner_id }}-${{ needs.verify-exact-release-request.outputs.release_request_digest }}
          path: |
            ${{ runner.temp }}/base-v1-soak-report.json
            ${{ runner.temp }}/base-v1-soak-child-receipt.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Verify and aggregate exact-candidate soak outputs
    needs: [verify-exact-release-request, verify-prebuilt-registry, p5-v2, soak-runners]
    environment: base-v1-production-qualification
    runs-on: [self-hosted, linux, x64, onebrain-base-v1-controller]
    env:
      SOAK_AGGREGATOR_PRIVATE_KEY: ${{ secrets.ONEBRAIN_SOAK_AGGREGATOR_PRIVATE_KEY }}
      P5_RAW_EVIDENCE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_RAW_EVIDENCE_ROOT }}
      P5_BUNDLE_ROOT: ${{ secrets.ONEBRAIN_P5_V2_BUNDLE_ROOT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.verify-exact-release-request.outputs.candidate_commit }}
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {pattern: base-v1-soak-raw-*, path: "${{ runner.temp }}/soak-raw"}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: "p5-v2-verified-${{ needs.verify-exact-release-request.outputs.release_request_digest }}", path: "${{ runner.temp }}/p5"}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with: {name: "registry-prebuilt-${{ needs.verify-exact-release-request.outputs.release_request_digest }}", path: "${{ runner.temp }}/registry"}
      - name: Aggregate signed child bytes without self-reference
        run: >-
          python scripts/release/validate_evidence_carry_forward.py aggregate-soak
          --request "$REQUEST_FILE" --signature "$REQUEST_SIGNATURE"
          --policy "$APPROVER_POLICY" --gpg-home "$QUALIFICATION_GPG_HOME"
          --registry-binding "$RUNNER_TEMP/registry/prebuilt-registry-binding.json"
          --registry-prebuilt-root "$REGISTRY_PREBUILT_ROOT"
          --candidate-semantic-evidence "$CANDIDATE_SEMANTIC_EVIDENCE"
          --p5-request "$RUNNER_TEMP/p5/p5-request.json"
          --p5-signature "$RUNNER_TEMP/p5/p5-request.sig"
          --p5-approval-policy "$RUNNER_TEMP/p5/p5-approval-policy.json"
          --p5-inventory "$RUNNER_TEMP/p5/p5-inventory.json"
          --p5-raw-evidence-root "$P5_RAW_EVIDENCE_ROOT"
          --p5-aggregate "$RUNNER_TEMP/p5/p5-multi-host-aggregate.json"
          --p5-executable "$P5_BUNDLE_ROOT/bin/p5_multi_host_agent_v2"
          --p5-bundle-root "$P5_BUNDLE_ROOT"
          --p5-registry-candidate-root "$REGISTRY_PREBUILT_ROOT"
          --executable "$P5_BUNDLE_ROOT/bin/dr_m5_soak_release"
          --sbom "$BASE_SBOM_FILE" --provenance "$BASE_PROVENANCE_FILE"
          --runner-image-evidence "$RUNNER_IMAGE_EVIDENCE_FILE"
          --receipts-root "$RUNNER_TEMP/soak-raw" --signing-key "$SOAK_AGGREGATOR_PRIVATE_KEY"
          --output "$RUNNER_TEMP/base-v1-exact-candidate-soak-aggregate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-v1-production-canary-${{ needs.verify-exact-release-request.outputs.release_request_digest }}
          path: ${{ runner.temp }}/base-v1-exact-candidate-soak-aggregate.json
          if-no-files-found: error
          retention-days: 90
      - name: Report distinct artifact names
        run: |
          echo "registry-prebuilt-binding"
          echo "p5-multi-host-aggregate"
          echo "base-v1-exact-candidate-soak-aggregate"
