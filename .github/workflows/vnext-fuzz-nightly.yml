name: vNext nightly parser fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnext-nightly-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - canonical_codec
          - session_reconciliation_codec
          - carrier_frame
          - journal_token_snapshot
          - domain_records
          - legacy_adapter
    defaults:
      run:
        working-directory: src/fuzz
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    steps:
      - uses: actions/checkout@v5
      - name: Install frozen Rust nightly
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src
            src/fuzz
      - name: Install frozen cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run frozen per-target budget
        run: >-
          cargo fuzz run ${{ matrix.target }}
          -- -max_total_time=60 -timeout=10 -max_len=4096
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: src/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
