[package]
name = "onebrain-mobile-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Autonomous OneBrain mobile runtime profile and bootstrap state"
publish = false

[dependencies]
ed25519-dalek = "2"
blake3 = "1"
chacha20poly1305 = "0.11"
getrandom = "0.3"
hex = "0.4"
ku-core = { path = "../ku-core", default-features = false, features = ["persist"] }
ku-kql = { path = "../ku-kql", default-features = false }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
