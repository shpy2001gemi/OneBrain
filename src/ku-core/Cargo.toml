[package]
name = "ku-core"
version = "0.7.0"
edition = "2021"
description = "KU v7 Core DNA — Self-contained Knowledge Unit engine with CCID and Concept Registry"
license = "MIT"

[features]
default = []
# Enable persistent ConceptDict storage (pure Rust, no C compiler needed)
persist = ["dep:redb"]
# Test-only process-kill synchronization. Production builds leave every hook a no-op.
dr-m5-crash-harness = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"    # JSON for AI tool-calling interface
ciborium = "0.2"     # CBOR serialization — will migrate to serde_ipld_dagcbor
serde_bytes = "0.11"  # Efficient byte vector serialization
crc32fast = "1.4"
blake3 = "1"         # ★ v6: BLAKE3 hash for CID computation
indexmap = "2"          # Insertion-ordered map for O(1) LRU cache
memmap2 = "0.9"         # Read-only, demand-paged sidecar indexes
ed25519-dalek = { version = "2", features = ["rand_core"] }  # Ed25519 signature verification
unicode-normalization = "0.1" # vNext canonical NormalizedText validation (reject, never rewrite)
chacha20poly1305 = "0.11" # vNext Private Vault XChaCha20-Poly1305 AEAD
zeroize = "1"            # erase caller-supplied vault key material on drop

# Persistent storage (pure Rust, ACID) — behind 'persist' feature
redb = { version = "2", optional = true }

[dev-dependencies]
rand = "0.8"          # For generating test signing keys
# criterion = "0.5"  # for benchmarks later
