[package]
name = "onebrain-seed"
version = "0.1.0"
edition = "2021"
description = "OneBrain Seed Node — lightweight P2P relay and peer discovery"
license = "MIT"

[[bin]]
name = "onebrain-seed"
path = "src/main.rs"

[dependencies]
onebrain-protocol = { path = "../onebrain-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
