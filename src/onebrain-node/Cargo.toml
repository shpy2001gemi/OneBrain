[package]
name = "onebrain-node"
version = "0.1.0"
edition = "2021"
description = "OneBrain Node runtime — core logic shared by all interfaces"
license = "MIT"

[lib]
name = "onebrain_node"
path = "src/lib.rs"

[[example]]
name = "dr_m5_fuzz_corpus_smoke"
required-features = ["vnext-chaos-harness"]

[[example]]
name = "dr_m5_soak_release"
required-features = ["vnext-soak-harness"]

[[example]]
name = "p5_canary_preflight"
required-features = ["vnext-canary-harness"]

[[example]]
name = "p5_operations_preflight"
required-features = ["vnext-canary-harness"]

[features]
default = []
vnext-network-runtime = [
    "ku-core/persist",
    "ku-net/persist",
    "ku-net/quic",
    "dep:rand",
    "dep:redb",
]
vnext-crash-harness = [
    "vnext-network-runtime",
    "ku-core/dr-m5-crash-harness",
    "ku-net/dr-m5-crash-harness",
    "ku-kql/dr-m5-crash-harness",
    "dep:sha2",
]
vnext-chaos-harness = [
    "vnext-network-runtime",
    "ku-net/dr-m5-chaos-harness",
    "dep:sha2",
]
vnext-compaction-harness = [
    "vnext-network-runtime",
    "ku-core/dr-m5-crash-harness",
    "ku-net/dr-m5-crash-harness",
    "ku-kql/dr-m5-crash-harness",
    "dep:sha2",
]
vnext-soak-harness = [
    "vnext-network-runtime",
    "ku-net/dr-m5-chaos-harness",
]
vnext-canary-harness = ["vnext-network-runtime"]

[dependencies]
ku-core = { path = "../ku-core" }
ku-net = { path = "../ku-net" }
ku-kql = { path = "../ku-kql", features = ["storage"] }
ku-ai = { path = "../ku-ai" }
ku-encoder = { path = "../ku-encoder" }
ku-mediator = { path = "../ku-mediator" }
onebrain-protocol = { path = "../onebrain-protocol" }
onebrain-archive = { path = "../onebrain-archive" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
blake3 = "1"
tracing = "0.1"
getrandom = "0.3"
fs2 = "0.4"
zeroize = "1"
unicode-segmentation = "1.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { version = "0.8", optional = true }
redb = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
ku-net = { path = "../ku-net", features = ["persist"] }
