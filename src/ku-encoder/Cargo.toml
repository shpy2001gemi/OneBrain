[package]
name = "ku-encoder"
version = "0.1.0"
edition = "2021"
description = "OneBrain AI-assisted KU encoding — text to CoreDna via local LLM tool calling"
license = "MIT"

[features]
default = ["ollama-http"]
# Legacy AiEncoder / Core DNA tool-encoding pipeline (ARCH-06 / D-051)
legacy = ["ku-core/legacy"]
# ARCH-09: host adapter for managed local Ollama extraction (HTTP client,
# Qwen tokenizer artifact, worker process). The onebrain-node runtime core
# depends on ku-encoder with default-features = false; hosts enable this.
ollama-http = ["ku-ai/ollama", "dep:reqwest", "dep:tokenizers", "dep:windows-sys"]

[[example]]
name = "extraction_probe"
required-features = ["ollama-http"]

[[example]]
name = "review_draft_probe"
required-features = ["ollama-http"]

[dependencies]
ku-core = { path = "../ku-core" }
ku-ai = { path = "../ku-ai", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
async-trait = "0.1"
regex = "1"
ed25519-dalek = "2"
blake3 = "1"
sha2 = "0.10"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"], optional = true }
