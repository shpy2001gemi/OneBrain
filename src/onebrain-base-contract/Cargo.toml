[package]
name = "onebrain-base-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Generated product-neutral contract for the OneBrain Base v1 runtime"
publish = false
build = "build.rs"

[dependencies]
blake3 = "1"
onebrain-archive = { path = "../onebrain-archive" }
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
