[package]
name = "onebrain-core"
version = "0.1.0"
edition = "2021"
description = "Synchronous, mobile-safe OneBrain canonical KU, fidelity, and composition engine (ARCH-10)"
license = "MIT"

[dependencies]
blake3 = { version = "1", features = ["pure"] }
chacha20poly1305 = "0.11"
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
ku-core = { path = "../ku-core", default-features = false, features = ["persist"] }
ku-kql = { path = "../ku-kql", default-features = false, features = ["storage"] }
onebrain-archive = { path = "../onebrain-archive" }
onebrain-base-contract = { path = "../onebrain-base-contract" }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
