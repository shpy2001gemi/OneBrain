[package]
name = "onebrain-archive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded encrypted archive container for the OneBrain Base runtime"
publish = false

[dependencies]
argon2 = "0.5.3"
blake3 = "1"
chacha20poly1305 = "0.11"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
