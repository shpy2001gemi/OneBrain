[package]
name = "onebrain-obt"
version = "0.1.0"
edition = "2021"
description = "Isolated post-commit vNext OBT dual-track benefit & accepted-work economy (P5, FW-07)"
license = "MIT"

[dependencies]
blake3 = "1"
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
ku-core = { path = "../ku-core", default-features = false, features = ["persist"] }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
