[package]
name = "onebrain-cli"
version = "0.1.0"
edition = "2021"
description = "OneBrain CLI — interactive terminal interface"
license = "MIT"

[[bin]]
name = "onebrain"
path = "src/main.rs"

[features]
default = ["base-v1"]
base-v1 = ["onebrain-node/base-v1", "onebrain-api/base-v1"]
legacy-read-compat = ["onebrain-node/legacy-read-compat", "onebrain-api/legacy-read-compat"]
vnext-network-runtime = [
    "onebrain-node/vnext-network-runtime",
    "onebrain-api/vnext-network-runtime",
]

[dependencies]
onebrain-node = { path = "../onebrain-node" }
onebrain-api = { path = "../onebrain-api" }
onebrain-base-contract = { path = "../onebrain-base-contract" }
ku-core = { path = "../ku-core" }
ku-kql = { path = "../ku-kql" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-std", "io-util"] }
blake3 = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
