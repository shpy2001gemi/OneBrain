[package]
name = "onebrain-base-abi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stable C ABI projection of the OneBrain Base v1 runtime"
publish = false

[features]
default = ["base-v1"]
base-v1 = []
legacy-read-compat = ["onebrain-node/legacy-read-compat"]

[lib]
name = "onebrain_base"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
blake3 = "1"
getrandom = "0.3"
onebrain-base-contract = { path = "../onebrain-base-contract" }
onebrain-node = { path = "../onebrain-node", default-features = false, features = ["base-v1"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
ku-core = { path = "../ku-core" }
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cbindgen)"] }
