[package]
name = "onebrain-protocol"
version = "0.1.0"
edition = "2021"
description = "OneBrain P2P Protocol — shared message types between node and seed"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
chacha20poly1305 = "0.11"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = "2"
sha2 = "0.10"
thiserror = "1"
zeroize = "1"
tokio = { version = "1", features = ["net", "io-util"] }
ku-core = { path = "../ku-core" }
blake3 = "1"

[dev-dependencies]
tempfile = "3"
