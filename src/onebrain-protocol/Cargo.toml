[package]
name = "onebrain-protocol"
version = "0.1.0"
edition = "2021"
description = "OneBrain P2P Protocol — shared message types between node and seed"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util"] }
ku-core = { path = "../ku-core" }
blake3 = "1"

[dev-dependencies]
