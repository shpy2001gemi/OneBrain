[package]
name = "ku-kql"
version = "0.1.0"
edition = "2021"
description = "KQL (Knowledge Query Language) parser, executor, and storage for OneBrain Protocol"
license = "MIT"

[features]
default = []
# Enable persistent storage (requires complete toolchain for getrandom)
storage = ["dep:redb", "ku-core/persist"]
dr-m5-crash-harness = ["ku-core/dr-m5-crash-harness"]
# Library-only typed KQL research modules with no production consumer (ARCH-11,
# D-051): OBKG projection, assembly search, relational alignment and structural
# signatures (slice 1) plus the private multipath island - multipath, query view,
# exploration, route packet, disclosure capsule - consumed only by the node M5
# benchmark companion (slice 2). Excluded from the default build; their tests run
# with this feature.
experimental = []

[dependencies]
# KU data types (frozen read-only KQL requires Core DNA read types)
ku-core = { path = "../ku-core", features = ["legacy-read"] }

# Parser
nom = "7"

# Storage (pure Rust, ACID) — behind 'storage' feature
redb = { version = "2", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (for CID computation)
blake3 = "1"
chacha20poly1305 = "0.11"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
