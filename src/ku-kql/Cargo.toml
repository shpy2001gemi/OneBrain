[package]
name = "ku-kql"
version = "0.1.0"
edition = "2021"
description = "KQL (Knowledge Query Language) parser, executor, and storage for OneBrain Protocol"
license = "MIT"

[features]
default = []
# Enable persistent storage (requires complete toolchain for getrandom)
storage = ["dep:redb", "ku-core/persist"]
dr-m5-crash-harness = ["ku-core/dr-m5-crash-harness"]

[dependencies]
# KU data types
ku-core = { path = "../ku-core" }

# Parser
nom = "7"

# Storage (pure Rust, ACID) — behind 'storage' feature
redb = { version = "2", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (for CID computation)
blake3 = "1"
chacha20poly1305 = "0.11"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
