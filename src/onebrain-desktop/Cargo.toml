[package]
name = "onebrain-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OneBrain Desktop — native desktop application powered by Tauri 2"

[lib]
name = "onebrain_desktop"
path = "src/lib.rs"
# This crate has no Rust unit tests. On Windows GNU, an empty Tauri test
# harness cannot load its native WebView entrypoint. Product compilation is
# enforced separately by the Windows default/feature CI matrix.
test = false
doctest = false

[[bin]]
name = "onebrain-desktop"
path = "src/main.rs"
test = false

[features]
default = []
vnext-outbound-first = [
    "vnext-network-runtime",
    "onebrain-node/vnext-outbound-first",
    "onebrain-api/vnext-outbound-first",
]
vnext-network-runtime = [
    "onebrain-node/vnext-network-runtime",
    "onebrain-api/vnext-network-runtime",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core OneBrain crates
onebrain-node = { path = "../onebrain-node" }
onebrain-api = { path = "../onebrain-api" }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"

# Shared dependencies (explicit — workspace root has no [workspace.dependencies])
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"

# Desktop-specific
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", features = ["json"] }
hostname = "0.4"
open = "5"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
ku-core = { path = "../ku-core" }
ku-kql = { path = "../ku-kql" }
ed25519-dalek = "2"
tokio-tungstenite = "0.29"
futures = "0.3"
onebrain-protocol = { path = "../onebrain-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
