[package]
name = "onebrain-api"
version = "0.1.0"
edition = "2021"
description = "OneBrain REST/WebSocket API — headless server interface"
license = "MIT"

[lib]
name = "onebrain_api"
path = "src/lib.rs"

[dependencies]
onebrain-node = { path = "../onebrain-node" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
futures = "0.3"
