[package]
name = "onebrain-api"
version = "0.1.0"
edition = "2021"
description = "OneBrain REST/WebSocket API — headless server interface"
license = "MIT"

[lib]
name = "onebrain_api"
path = "src/lib.rs"

[features]
default = []
vnext-network-runtime = ["onebrain-node/vnext-network-runtime"]

[dependencies]
onebrain-node = { path = "../onebrain-node" }
ku-core = { path = "../ku-core" }
ku-kql = { path = "../ku-kql", features = ["storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tempfile = "3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "native-tls"] }

[dev-dependencies]
ed25519-dalek = "2"
