language = "C"
include_guard = "ONEBRAIN_MOBILE_BRIDGE_H"
pragma_once = true
documentation = true
usize_is_size_t = true
style = "both"

header = """
/*
 * Generated by cbindgen from onebrain-mobile-bridge.
 * Do not edit this file by hand.
 */
"""

trailer = """
/* End generated OneBrain Mobile bridge declarations. */
"""

[parse]
parse_deps = false

[export]
include = [
  "ob_mobile_bridge_abi_version",
  "ob_mobile_bridge_core_version",
  "ob_mobile_bridge_registry_request_issued",
  "ob_mobile_bridge_round_trip",
  "ObMobileRuntimeSnapshot",
  "ob_mobile_runtime_open_utf8",
  "ob_mobile_runtime_snapshot",
  "ob_mobile_runtime_graceful_stop",
]
