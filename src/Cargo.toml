[workspace]
members = [
    # ── Core Libraries ──
    "ku-core",          # vNext foundation (canonical objects, semantic frames, vault) + legacy Core DNA/OBT
    "ku-net",           # vNext QUIC session/reconciliation (feature-gated) + legacy DHT/SWIM/gossip
    "ku-kql",           # Legacy text KQL (local read-only surface) + typed vNext KQL library; storage/blob
    "ku-ai",            # AI backend (Ollama integration)
    "ku-encoder",       # Text → KU encoding pipeline
    "ku-mediator",      # User intent → AI → response pipeline

    # ── Shared Protocol ──
    "onebrain-protocol",# Shared P2P message types (node ↔ seed)
    "onebrain-relay",   # Permissionless outbound-first relay service

    # ── Node Runtime (shared by ALL interfaces) ──
    "onebrain-node",    # ★ Library: OneBrainNode, Base runtime, KU workspace; vNext network behind cargo features

    # ── Interface Projects (Rust) ──
    "onebrain-cli",     # Interface: CLI REPL (Phase 0 ✅)
    "onebrain-api",     # Interface: Local REST + WebSocket API (Phase 1)
    "onebrain-desktop", # Interface: Tauri 2.x Desktop App (Phase 2)
    "onebrain-mobile-core", # Autonomous mobile runtime profile and bootstrap state
    "onebrain-mobile-bridge", # Narrow C ABI/JNI feasibility bridge for Flutter NativeHost
    "onebrain-archive",   # Shared encrypted Base archive container and verified spool
    "onebrain-base-contract", # Generated product-neutral Base v1 semantic contract
    "onebrain-base-abi",      # Stable C ABI projection of the Base v1 facade

    # ── Server / Infrastructure ──
    "onebrain-seed",    # Explicit legacy TCP/JSON compatibility daemon; not a vNext relay

    # ── Demo / Test ──
    "ku-demo",          # 3-node simulation demo

    # ── Non-Rust Interface Projects (NOT workspace members) ──
    # onebrain-web        → React + Vite + TypeScript (Phase 1)
    # onebrain-mobile     → Flutter + JNI NativeHost via onebrain-mobile-bridge (not flutter_rust_bridge)
    # onebrain-glasses    → Web App / visionOS (Phase 4)
    # onebrain-bot        → Node.js / Python (Phase 2, low priority)
    # onebrain-extension  → WebExtension API (Phase 3)
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
